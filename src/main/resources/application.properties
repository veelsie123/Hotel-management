```properties
# =========================================================
# HOTEL MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# =========================================================

# Server
server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/dg_hotel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=demo
spring.datasource.password=Hotel@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Tables are managed by Flyway
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in the terminal
spring.jpa.show-sql=true

# Format SQL queries for easier reading
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY DATABASE MIGRATIONS
# =========================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# =========================================================
# JWT SECURITY
# =========================================================

# JWT access token secret
jwt.secret=${JWT_SECRET:changeit-secret-demo}

# JWT refresh token secret
jwt.refresh-secret=${JWT_REFRESH_SECRET:changeit-refresh-demo}

# Access token expiration: 1 hour
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRES_MS:3600000}

# Refresh token expiration: 14 days
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRES_MS:1209600000}


# =========================================================
# LOGGING
# =========================================================

# Show Spring Security information
logging.level.org.springframework.security=INFO

# Show Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

# Show Hibernate parameter binding
logging.level.org.hibernate.orm.jdbc.bind=TRACE
```
